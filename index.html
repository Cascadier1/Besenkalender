<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Besenwirtschaften Öhringen & Umgebung</title>
    
    <!-- FullCalendar CSS & JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <!-- Tailwind CSS für schönes, modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .fc-event {
            cursor: pointer;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-6">
        <!-- Header -->
        <header class="mb-6 flex flex-col md:flex-row md:items-end justify-between border-b pb-4 gap-2">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-amber-950 flex items-center gap-2">
                    <i class="fa-solid fa-wine-glass text-rose-800"></i>
                    Besenkalender Öhringen & Umgebung
                </h1>
                <p class="text-sm text-slate-500 mt-1">Aktuelle Öffnungszeiten & Weinstuben im Umkreis von ca. 15 km</p>
            </div>
            <!-- Hier wird das Aktualisierungsdatum eingefügt -->
            <div id="last-updated" class="text-xs bg-amber-100 text-amber-900 px-3 py-1.5 rounded-full inline-flex items-center gap-1.5 font-medium self-start md:self-auto shadow-sm">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Wird geladen...</span>
            </div>
        </header>

        <!-- Kalender-Container -->
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Info-Modal beim Anklicken -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold text-slate-900 mb-2"></h3>
            <div class="space-y-3 text-sm text-slate-600 mt-4">
                <p><i class="fa-solid fa-location-dot text-rose-700 w-5"></i> <strong id="modalOrt"></strong></p>
                <p><i class="fa-solid fa-map-pin text-slate-400 w-5"></i> <span id="modalLocation"></span></p>
                <p><i class="fa-solid fa-clock text-amber-600 w-5"></i> <span id="modalHours"></span></p>
                <div class="p-3 bg-amber-50 rounded-lg text-amber-950 text-xs border border-amber-200" id="modalNotes"></div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const updatedEl = document.querySelector('#last-updated span');

            // events.json mit Cache-Busting abrufen
            fetch('events.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    let eventsList = [];
                    
                    // Unterstützt sowohl altes als auch neues JSON-Format
                    if (Array.isArray(data)) {
                        eventsList = data;
                        updatedEl.textContent = "Zuletzt aktualisiert: Heute";
                    } else {
                        eventsList = data.events || [];
                        updatedEl.textContent = "Zuletzt aktualisiert: " + (data.last_updated || "Unbekannt");
                    }

                    const calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: window.innerWidth < 768 ? 'listMonth' : 'dayGridMonth',
                        locale: 'de',
                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: 'dayGridMonth,listMonth'
                        },
                        buttonText: {
                            today: 'Heute',
                            month: 'Monat',
                            list: 'Liste'
                        },
                        events: eventsList,
                        eventClick: function(info) {
                            const props = info.event.extendedProps;
                            document.getElementById('modalTitle').textContent = info.event.title;
                            document.getElementById('modalOrt').textContent = props.ort || '';
                            document.getElementById('modalLocation').textContent = props.location || '';
                            document.getElementById('modalHours').textContent = props.hours || '';
                            document.getElementById('modalNotes').textContent = props.notes || '';
                            document.getElementById('eventModal').classList.remove('hidden');
                            document.getElementById('eventModal').classList.add('flex');
                        }
                    });

                    calendar.render();
                })
                .catch(err => {
                    console.error("Fehler beim Laden der events.json:", err);
                    updatedEl.textContent = "Stand: Offline";
                });
        });

        function closeModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('eventModal').classList.remove('flex');
        }
    </script>
</body>
</html><!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Besenkalender Öhringen & Umgebung</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/de.global.min.js"></script>
    <style>
        :root { --primary: #831843; --primary-dark: #500724; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: #1e293b; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: var(--primary); margin: 0 0 6px 0; }
        header p { color: #64748b; margin: 0; }
        .calendar-card { background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .fc-event { cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 480px; position: relative; }
        .modal-close { position: absolute; top: 12px; right: 14px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b; }
        .modal h2 { margin: 0 0 4px 0; color: var(--primary); font-size: 1.3rem; }
        .sub { color: #64748b; font-weight: bold; margin-bottom: 12px; font-size: 0.9rem; }
        .row { margin-bottom: 10px; font-size: 0.95rem; }
        .row strong { display: block; font-size: 0.8rem; text-transform: uppercase; color: #475569; }
        .map-btn { display: inline-block; margin-top: 10px; background: #2563eb; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🍇 Besenkalender Öhringen</h1>
        <p>Automatisch aktualisierte Öffnungszeiten</p>
    </header>
    <div class="calendar-card">
        <div id="calendar"></div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeM()">&times;</button>
        <h2 id="mTitle"></h2>
        <div id="mOrt" class="sub"></div>
        <div class="row"><strong>Adresse:</strong><span id="mAddr"></span></div>
        <div class="row"><strong>Öffnungszeiten:</strong><span id="mHours"></span></div>
        <div class="row"><strong>Details:</strong><span id="mNotes"></span></div>
        <a id="mMap" class="map-btn" target="_blank" href="#">📍 In Google Maps öffnen</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        
        // Holt immer die aktuelle events.json (Cache-Busting mit Timestamp)
        fetch('events.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    locale: 'de',
                    initialView: 'dayGridMonth',
                    firstDay: 1,
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' },
                    buttonText: { today: 'Heute', month: 'Monat', list: 'Liste' },
                    events: data,
                    eventClick: function(info) {
                        const p = info.event.extendedProps;
                        document.getElementById('mTitle').innerText = info.event.title;
                        document.getElementById('mOrt').innerText = p.ort;
                        document.getElementById('mAddr').innerText = p.location;
                        document.getElementById('mHours').innerText = p.hours;
                        document.getElementById('mNotes').innerText = p.notes;
                        document.getElementById('mMap').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.location);
                        document.getElementById('modal').classList.add('active');
                    }
                });
                calendar.render();
            });
    });

    function closeM() { document.getElementById('modal').classList.remove('active'); }
    window.onclick = function(e) { if(e.target === document.getElementById('modal')) closeM(); }
</script>
</body>
</html>
