name: Tägliches Besen-Update

on:
  schedule:
    - cron: '0 5 * * *' # Läuft täglich um 05:00 Uhr morgens
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - run: |
          git config --global user.name "Besen-Bot"
          git config --global user.email "bot@github.com"
          git add events.json
          git commit -m "Automatische Besen-Aktualisierung" || exit 0
          git push
